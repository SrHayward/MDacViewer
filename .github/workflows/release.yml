name: Release

# Builds the app + DMG on a GitHub-hosted Apple Silicon Mac.
# - Push a tag like v1.0.0  → a GitHub Release is published with the DMG attached.
# - Run manually (Actions tab) → the DMG is available as a workflow artifact.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. 1.0.1)'
        required: true

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build app
        run: VERSION=${{ steps.version.outputs.version }} ./Scripts/build-app.sh

      - name: Build DMG
        run: VERSION=${{ steps.version.outputs.version }} ./Scripts/make-dmg.sh

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/MDacViewer-${{ steps.version.outputs.version }}.dmg" \
            --title "MDacViewer ${{ steps.version.outputs.version }}" \
            --generate-notes

      - name: Upload DMG as workflow artifact (manual runs)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: MDacViewer-${{ steps.version.outputs.version }}-dmg
          path: dist/*.dmg
